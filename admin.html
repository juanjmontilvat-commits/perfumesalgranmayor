<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#182C29">
<link rel="icon" href="logo.png">
<title>Panel MOTOSA Cajas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{
  --font-display:'Cinzel',Georgia,serif;--font-body:'Montserrat','Segoe UI',system-ui,sans-serif;
  --bg:#F1E7D5;--surface:#FBF6EC;--ink:#1B2A27;--muted:#6A6350;--line:#DDCFB4;
  --forest:#182C29;--on-forest:#EFE3CC;--gold-grad:linear-gradient(135deg,#EBD59B,#B69A74 48%,#8A6C3C);
  --btn-bg:#182C29;--btn-fg:#F4E9D2;--terra:#812C14;--ok:#3F6B3A;--warn:#A55B23;--photo:#fff;--gold-text:#7A5C2E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A19;--surface:#162725;--ink:#EFE3CC;--muted:#A9A08A;--line:#2B433E;--forest:#0A1413;--btn-bg:#D8BC85;--btn-fg:#182C29;--terra:#E08A6F;--ok:#8FC186;--warn:#E3A265;--gold-text:#D8BC85;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid #B69A74;outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:.05em}
.bar{background:var(--forest);color:var(--on-forest);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.bar img{height:38px}.bar .sp{flex:1}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--btn-bg);color:var(--btn-fg)}
.btn.ghost{background:transparent;border:1px solid currentColor;color:inherit}.btn.gold{background:var(--gold-grad);color:#1C2A26}.btn:disabled{opacity:.5}
.wrap{max-width:1100px;margin:0 auto;padding:18px 0 60px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:12.5px}
.tabs button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.stat b{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}.f label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 10px;min-width:0;max-width:100%}
textarea{height:auto;padding:8px 10px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line)}
.s-nuevo{color:var(--warn)}.s-pagado,.s-enviado,.s-entregado{color:var(--ok)}.s-cancelado{color:var(--terra)}
.ord{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center}
.ord .t{font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:12.5px}
details summary{cursor:pointer;color:var(--gold-text);font-weight:600;font-size:12.5px;margin-top:8px}
.itm{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.prod{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pic{width:64px;height:64px;border-radius:10px;background:var(--photo);border:1px solid var(--line);overflow:hidden;padding:0;display:grid;place-items:center;color:#999;font-size:10px}
.pic img{width:100%;height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.login{max-width:380px;margin:60px auto}
.err{color:var(--terra);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
</head>
<body>
<div class="bar"><img src="logo.png" alt="MOTOSA"><h1 style="font-size:16px">PANEL DE CAJAS</h1><span class="sp"></span><span id="who" class="muted" style="color:var(--on-forest)"></span><button class="btn ghost" id="out" hidden>Salir</button></div>

<main class="wrap">
  <section id="v-login" class="login box" hidden>
    <h2 style="font-size:20px;margin-bottom:14px">Entrar</h2>
    <div class="f" style="margin-bottom:10px"><label for="em">Correo</label><input id="em" type="email" autocomplete="username"></div>
    <div class="f" style="margin-bottom:14px"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
    <p class="err" id="lerr" hidden></p>
    <button class="btn gold" id="go" style="width:100%">Entrar</button>
  </section>
  <section id="v-deny" class="login box" hidden><h2 style="font-size:18px">Sin permiso</h2><p>Este usuario no es administrador de las cajas. Ejecuta el archivo <b>03_administrador_y_vendedores.sql</b> con este correo.</p></section>
  <section id="v-app" hidden>
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const CFG=window.MOTOSA_CONFIG||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toFixed(2);
const fdate=d=>new Date(d).toLocaleString('es-VE',{dateStyle:'short',timeStyle:'short'});
const STATUS=['nuevo','pagado','enviado','entregado','cancelado'];
const OK=['pagado','enviado','entregado'];
let sb=null,TAB='pedidos',ST={orders:[],products:[],sellers:[],tiers:[]},F={status:'todos',q:''};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
try{
  if(!CFG.SUPABASE_URL||/TU-/i.test(CFG.SUPABASE_URL+CFG.SUPABASE_ANON_KEY))throw new Error('config');
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
}catch(e){$('#v-login').hidden=false;$('#v-login').innerHTML='<h2 style="font-size:18px">Falta configurar</h2><p>Abre <b>config.js</b> y pega tu SUPABASE_URL y tu SUPABASE_ANON_KEY.</p>'}

async function q(p){const r=await p;if(r.error){toast(r.error.message);throw r.error}return r.data}

/* ---------- Acceso ---------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#v-login').hidden=false;$('#v-app').hidden=true;$('#out').hidden=true;return}
  $('#who').textContent=session.user.email;$('#out').hidden=false;$('#v-login').hidden=true;
  const {data:ok}=await sb.rpc('is_box_admin');
  if(!ok){$('#v-deny').hidden=false;return}
  $('#v-deny').hidden=true;$('#v-app').hidden=false;
  await loadAll();drawTabs();draw();
}
async function loadAll(){
  const [o,p,s,t]=await Promise.all([
    sb.from('box_orders').select('*, box_sellers(name), box_order_items(qty,unit_price,unit_cost,box_products(brand,name)), box_reservations(box_products(brand,name))').order('created_at',{ascending:false}).limit(500),
    sb.from('box_products').select('*').order('category',{ascending:false}).order('brand').order('name'),
    sb.from('box_sellers').select('*').order('name'),
    sb.from('box_tiers').select('*').order('sort')]);
  for(const r of [o,p,s,t])if(r.error)toast(r.error.message);
  ST={orders:o.data||[],products:p.data||[],sellers:s.data||[],tiers:t.data||[]};
}
$('#go')&&($('#go').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#lerr').hidden=false;$('#lerr').textContent='Correo o contraseña incorrectos.';return}
  $('#lerr').hidden=true;start();
});
$('#pw')&&$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#out')&&($('#out').onclick=async()=>{await sb.auth.signOut();location.reload()});

/* ---------- Pestañas ---------- */
function drawTabs(){
  const tabs=[['pedidos','Pedidos'],['catalogo','Catálogo'],['vendedores','Vendedores'],['precios','Precios']];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${TAB===k}">${l}</button>`).join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){TAB=b.dataset.tab;drawTabs();draw()}});
function draw(){({pedidos:drawOrders,catalogo:drawCatalog,vendedores:drawSellers,precios:drawTiers})[TAB]()}

/* ---------- Pedidos ---------- */
function drawOrders(){
  const O=ST.orders,paid=O.filter(o=>OK.includes(o.status));
  const sales=paid.reduce((a,o)=>a+ +o.total,0),cost=paid.reduce((a,o)=>a+ +o.cost_total,0),com=paid.reduce((a,o)=>a+ +o.seller_commission,0);
  const pend=O.filter(o=>o.status==='nuevo').reduce((a,o)=>a+ +o.total,0);
  const by={};paid.forEach(o=>{const k=(o.box_sellers&&o.box_sellers.name)||o.seller_name||'Sin vendedor';(by[k]=by[k]||{n:0,v:0,c:0});by[k].n++;by[k].v+= +o.total;by[k].c+= +o.seller_commission});
  const list=O.filter(o=>F.status==='todos'||o.status===F.status);
  $('#pane').innerHTML=`
  <div class="cards">
    <div class="stat"><small>Pedidos</small><b>${O.length}</b></div>
    <div class="stat"><small>Por cobrar</small><b>${money(pend)}</b></div>
    <div class="stat"><small>Ventas cobradas</small><b>${money(sales)}</b></div>
    <div class="stat"><small>Comisiones</small><b>${money(com)}</b></div>
    <div class="stat"><small>Ganancia neta</small><b>${money(sales-cost-com)}</b></div>
  </div>
  ${Object.keys(by).length?`<div class="box scroll"><h3 style="font-size:14px;margin-bottom:8px">Comisiones por vendedor (pedidos cobrados)</h3><table><tr><th>Vendedor</th><th>Pedidos</th><th>Ventas</th><th>Comisión a pagar</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${money(v.v)}</td><td><b>${money(v.c)}</b></td></tr>`).join('')}</table></div>`:''}
  <div class="row" style="margin-bottom:10px"><div class="f"><label for="fs">Estado</label><select id="fs"><option value="todos">Todos</option>${STATUS.map(s=>`<option ${F.status===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn ghost" id="rl">Actualizar</button></div>
  ${list.length?list.map(orderCard).join(''):'<div class="box muted">No hay pedidos con ese estado.</div>'}`;
  $('#fs').onchange=e=>{F.status=e.target.value;drawOrders()};
  $('#rl').onclick=async()=>{await loadAll();draw();toast('Actualizado')};
}
function orderCard(o){
  const items=o.box_order_items||[],res=o.box_reservations||[];
  const sname=(o.box_sellers&&o.box_sellers.name)||'';
  return `<div class="box" data-o="${o.id}">
    <div class="ord">
      <div><b>${esc(o.order_code||'#'+o.id)}</b> · ${esc(o.customer_first)} ${esc(o.customer_last)} <span class="muted">· ${esc(o.customer_state)} · ${fdate(o.created_at)}</span><br>
        <span class="muted">Caja ${esc(o.tier_id.toUpperCase())} · Vendedor: ${esc(sname||o.seller_name||'—')}${!o.seller_id&&o.seller_name&&o.seller_name!=='Sin vendedor'?' <b style="color:var(--warn)">(sin enlazar: elige el vendedor abajo)</b>':''}</span></div>
      <div class="t">${money(o.total)}</div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="f"><label>Estado</label><select data-a="status" class="s-${o.status}">${STATUS.map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="f"><label>Vendedor</label><select data-a="seller"><option value="">Sin vendedor</option>${ST.sellers.map(s=>`<option value="${s.id}" ${o.seller_id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="f"><label>Comisión</label><span>${OK.includes(o.status)?`<b>${money(o.seller_commission)}</b>`:`<span class="muted">${money(o.total*o.commission_rate)} al cobrar</span>`}</span></div>
      <div class="f" style="flex:1;min-width:160px"><label>Notas</label><input type="text" data-a="notes" value="${esc(o.notes||'')}" placeholder="Pago recibido, guía de envío…"></div>
    </div>
    <details><summary>Ver perfumes (${items.reduce((a,i)=>a+i.qty,0)})${res.length?` y ${res.length} apartado(s)`:''}</summary>
      ${items.map(i=>`<div class="itm"><span>${i.qty} × ${esc(i.box_products?i.box_products.brand+' '+i.box_products.name:'')}</span><span>${money(i.unit_price)} c/u · ${money(i.qty*i.unit_price)}</span></div>`).join('')}
      ${res.length?`<p class="muted" style="margin:8px 0 0"><b>Apartados:</b> ${res.map(r=>esc(r.box_products?r.box_products.brand+' '+r.box_products.name:'')).join(', ')}</p>`:''}
      <p class="muted" style="margin:8px 0 0">Costo de la mercancía: ${money(o.cost_total)} · Ganancia bruta: ${money(o.total-o.cost_total)}</p>
    </details></div>`;
}
document.addEventListener('change',async e=>{
  const t=e.target,card=t.closest&&t.closest('[data-o]');
  if(card&&t.dataset.a){
    const id=+card.dataset.o,a=t.dataset.a;
    const patch=a==='status'?{status:t.value}:a==='seller'?{seller_id:t.value||null}:{notes:t.value};
    const {error}=await sb.from('box_orders').update(patch).eq('id',id);
    if(error){toast(error.message);return}
    toast('Guardado');await loadAll();if(a!=='notes')drawOrders();return;
  }
  const row=t.closest&&t.closest('[data-p]');
  if(row&&t.dataset.a){
    const code=row.dataset.p,a=t.dataset.a;
    const v=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;
    const map={gender:'gender',available:'available',active:'active',features:'features',cost:'cost'};
    const {error}=await sb.from('box_products').update({[map[a]]:v}).eq('code',code);
    if(error){toast(error.message);return}
    const p=ST.products.find(x=>x.code===code);p[map[a]]=v;toast('Guardado');if(a==='cost')drawCatalog();return;
  }
});

/* ---------- Catálogo ---------- */
function prices(p){return ST.tiers.map(t=>Math.round((+p.cost+ +t.markup)*100)/100)}
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const c=document.createElement('canvas');c.width=c.height=720;const x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,720,720);
    const r=Math.min(660/im.width,660/im.height),w=im.width*r,h=im.height*r;
    x.drawImage(im,(720-w)/2,(720-h)/2,w,h);
    return await new Promise(res=>c.toBlob(res,'image/jpeg',.86));
  }finally{URL.revokeObjectURL(url)}
}
async function uploadPhoto(code,file){
  const blob=await shrink(file);
  const path=code+'.jpg';
  const {error}=await sb.storage.from('perfume-photos').upload(path,blob,{upsert:true,contentType:'image/jpeg',cacheControl:'3600'});
  if(error)throw error;
  const url=sb.storage.from('perfume-photos').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
  const r=await sb.from('box_products').update({photo_url:url}).eq('code',code);
  if(r.error)throw r.error;
  const p=ST.products.find(x=>x.code===code);if(p)p.photo_url=url;
}
function drawCatalog(){
  const ql=F.q.trim().toLowerCase();
  const list=ST.products.filter(p=>!ql||(p.brand+' '+p.name+' '+p.code).toLowerCase().includes(ql));
  const names=ST.tiers.map(t=>t.name);
  const withPhoto=ST.products.filter(p=>p.photo_url).length;
  $('#pane').innerHTML=`
  <div class="box">
    <div class="row"><b>${ST.products.length} perfumes</b><span class="muted">· ${withPhoto} con foto</span><span style="flex:1"></span>
      <label class="btn gold" style="cursor:pointer">Subir fotos en lote<input id="bulk" type="file" accept="image/*" multiple hidden></label>
      <button class="btn ghost" id="addp">Agregar perfume</button></div>
    <p class="muted" style="margin:8px 0 0">En lote, cada archivo debe llamarse como el código del perfume, por ejemplo <b>PE-ARB-0001.jpg</b>. La foto se ajusta sola a un cuadro blanco.</p>
    <div id="newp" hidden style="margin-top:12px" class="row">
      <div class="f"><label for="n_c">Código</label><input id="n_c" type="text" placeholder="PE-ARB-0500"></div>
      <div class="f"><label for="n_b">Marca</label><input id="n_b" type="text"></div>
      <div class="f"><label for="n_n">Nombre</label><input id="n_n" type="text"></div>
      <div class="f"><label for="n_g">Género</label><select id="n_g"><option>Mujer</option><option>Hombre</option><option>Unisex</option></select></div>
      <div class="f"><label for="n_k">Categoría</label><select id="n_k"><option>Árabe</option><option>Diseñador</option></select></div>
      <div class="f"><label for="n_s">Set (opcional)</label><input id="n_s" type="text" placeholder="Set de 3 perfumes"></div>
      <div class="f"><label for="n_x">Costo $</label><input id="n_x" type="number" step="0.5" min="0" style="width:90px"></div>
      <button class="btn" id="savep">Guardar</button></div>
  </div>
  <div class="f" style="margin-bottom:8px;max-width:340px"><label for="cq">Buscar</label><input id="cq" type="text" value="${esc(F.q)}" placeholder="Marca, nombre o código"></div>
  <div class="box" style="padding:4px 14px">${list.map(p=>`
    <div class="prod" data-p="${esc(p.code)}">
      <button class="pic" data-pick="${esc(p.code)}" aria-label="Subir foto de ${esc(p.name)}">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="">`:'Subir foto'}</button>
      <div style="min-width:0">
        <b>${esc(p.brand)} ${esc(p.name)}</b> <span class="muted">· ${esc(p.code)} · ${esc(p.category)}${p.is_luxury?' · Lujo':''}${p.set_label?' · '+esc(p.set_label):''}</span>
        <div class="row" style="margin-top:6px">
          <div class="f"><label>Género</label><select data-a="gender">${['Mujer','Hombre','Unisex'].map(g=>`<option ${p.gender===g?'selected':''}>${g}</option>`).join('')}</select></div>
          <div class="f"><label>Costo $</label><input type="number" step="0.5" min="0" data-a="cost" value="${p.cost}" style="width:84px"></div>
          <div class="f"><label>Venta</label><span class="muted">${prices(p).map((x,i)=>`${names[i]?names[i].slice(0,3):''} ${money(x)}`).join(' · ')}</span></div>
          <label class="row" style="gap:6px"><input type="checkbox" data-a="available" ${p.available?'checked':''}> Disponible</label>
          <label class="row" style="gap:6px"><input type="checkbox" data-a="active" ${p.active?'checked':''}> Visible</label>
        </div>
        <div class="f" style="margin-top:6px"><label>Características (notas, tamaño, familia olfativa)</label><input type="text" data-a="features" value="${esc(p.features||'')}" placeholder="Ej: Vainilla, canela y dátiles · 100 ml"></div>
      </div></div>`).join('')||'<p class="muted">Sin resultados.</p>'}</div>`;
  $('#cq').oninput=e=>{F.q=e.target.value;clearTimeout(drawCatalog.t);drawCatalog.t=setTimeout(()=>{drawCatalog();const i=$('#cq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
  $('#addp').onclick=()=>{$('#newp').hidden=!$('#newp').hidden};
  $('#savep').onclick=async()=>{
    const row={code:$('#n_c').value.trim().toUpperCase().replace(/\s+/g,''),brand:$('#n_b').value.trim(),name:$('#n_n').value.trim(),gender:$('#n_g').value,category:$('#n_k').value,set_label:$('#n_s').value.trim()||null,cost:+$('#n_x').value};
    if(!row.code||!row.brand||!row.name||!(row.cost>=0)||$('#n_x').value===''){toast('Completa código, marca, nombre y costo');return}
    const {error}=await sb.from('box_products').insert(row);
    if(error){toast(error.message);return}
    toast('Perfume agregado');await loadAll();drawCatalog();
  };
  $('#bulk').onchange=async e=>{
    let ok=0,miss=[];
    for(const f of e.target.files){
      const code=f.name.replace(/\.[^.]+$/,'').replace(/\s+/g,'').toUpperCase();
      if(!ST.products.some(p=>p.code===code)){miss.push(f.name);continue}
      try{await uploadPhoto(code,f);ok++;toast(`Subiendo… ${ok}`)}catch(err){toast(err.message||'Error al subir')}
    }
    toast(`${ok} fotos subidas${miss.length?` · sin código: ${miss.slice(0,3).join(', ')}`:''}`);drawCatalog();
  };
}
const pick=document.createElement('input');pick.type='file';pick.accept='image/*';let pickCode=null;
pick.onchange=async()=>{const f=pick.files[0];if(!f)return;try{await uploadPhoto(pickCode,f);toast('Foto guardada');drawCatalog()}catch(e){toast(e.message||'Error al subir')}pick.value=''};
document.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(b){pickCode=b.dataset.pick;pick.click()}});

/* ---------- Vendedores ---------- */
const slugify=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
const linkFor=slug=>new URL('index.html?v='+slug,location.href).href.replace('index.html','');
function drawSellers(){
  $('#pane').innerHTML=`
  <div class="box"><h3 style="font-size:14px;margin-bottom:10px">Nuevo vendedor</h3>
    <div class="row"><div class="f"><label for="sv_n">Nombre</label><input id="sv_n" type="text" placeholder="Gardimar"></div>
    <div class="f"><label for="sv_s">Código del enlace</label><input id="sv_s" type="text" placeholder="gardimar"></div>
    <button class="btn" id="sv_add" style="align-self:flex-end">Agregar</button></div>
    <p class="muted" style="margin:8px 0 0">Cada vendedor comparte su enlace propio. El cliente que entra por ahí queda asignado a él y no puede cambiarlo.</p></div>
  ${ST.sellers.map(s=>`<div class="box" data-s="${s.id}"><div class="row"><b>${esc(s.name)}</b><span class="pill ${s.active?'s-pagado':'s-cancelado'}">${s.active?'activo':'inactivo'}</span><span style="flex:1"></span>
    <button class="btn ghost" data-sact="toggle">${s.active?'Desactivar':'Activar'}</button></div>
    <div class="row" style="margin-top:8px"><code style="word-break:break-all">${esc(linkFor(s.slug))}</code><button class="btn ghost" data-copy="${esc(linkFor(s.slug))}">Copiar enlace</button></div></div>`).join('')||'<div class="box muted">Aún no hay vendedores.</div>'}`;
  $('#sv_n').oninput=e=>{if(!$('#sv_s').dataset.t)$('#sv_s').value=slugify(e.target.value)};
  $('#sv_s').oninput=e=>{e.target.dataset.t='1'};
  $('#sv_add').onclick=async()=>{
    const name=$('#sv_n').value.trim(),slug=slugify($('#sv_s').value);
    if(!name||slug.length<2){toast('Escribe el nombre y un código de al menos 2 letras');return}
    const {error}=await sb.from('box_sellers').insert({name,slug});
    if(error){toast(error.message.includes('duplicate')?'Ese código ya existe':error.message);return}
    toast('Vendedor agregado');await loadAll();drawSellers();
  };
}
document.addEventListener('click',async e=>{
  const c=e.target.closest('[data-copy]');
  if(c){try{await navigator.clipboard.writeText(c.dataset.copy);toast('Enlace copiado')}catch(err){toast('Copia el enlace manualmente')}}
  const t=e.target.closest('[data-sact]');
  if(t){const id=t.closest('[data-s]').dataset.s,s=ST.sellers.find(x=>x.id===id);
    const {error}=await sb.from('box_sellers').update({active:!s.active}).eq('id',id);
    if(error){toast(error.message);return}await loadAll();drawSellers()}
});

/* ---------- Precios y niveles ---------- */
function drawTiers(){
  $('#pane').innerHTML=`<div class="box"><h3 style="font-size:14px;margin-bottom:6px">Niveles de caja</h3>
    <p class="muted" style="margin:0 0 12px">Precio de venta por perfume = costo + ganancia por perfume. Al cambiar un valor, la tienda lo usa en el siguiente pedido. La cantidad por caja se define en la tienda (8, 12 y 24).</p>
    ${ST.tiers.map(t=>`<div class="row" data-t="${t.id}" style="padding:10px 0;border-top:1px solid var(--line)">
      <b style="min-width:110px">${esc(t.name)} · ${t.qty}</b>
      <div class="f"><label>Ganancia por perfume $</label><input type="number" step="0.5" min="0" data-ta="markup" value="${t.markup}" style="width:100px"></div>
      <div class="f"><label>Comisión vendedor %</label><input type="number" step="0.5" min="0" max="100" data-ta="rate" value="${(+t.seller_rate*100).toFixed(2).replace(/\.?0+$/,'')}" style="width:100px"></div>
      <span class="muted">Ej.: costo $11 → vende a ${money(11+ +t.markup)}</span></div>`).join('')}
    <button class="btn gold" id="tsave" style="margin-top:12px">Guardar niveles</button></div>`;
  $('#tsave').onclick=async()=>{
    for(const r of document.querySelectorAll('[data-t]')){
      const markup=+r.querySelector('[data-ta=markup]').value,rate=+r.querySelector('[data-ta=rate]').value/100;
      if(!(markup>=0)||!(rate>=0&&rate<=1)){toast('Revisa los valores');return}
      const {error}=await sb.from('box_tiers').update({markup,seller_rate:rate}).eq('id',r.dataset.t);
      if(error){toast(error.message);return}
    }
    toast('Niveles guardados');await loadAll();drawTiers();
  };
}

if(sb)start();
</script>
</body>
</html>
